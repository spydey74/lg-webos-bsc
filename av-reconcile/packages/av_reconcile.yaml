# AV reconcile -- Home Assistant package (helpers + headphone sensor).
#
# Drop into <config>/packages/av_reconcile.yaml (with `homeassistant: packages:
# !include_dir_named packages` in configuration.yaml), OR create the equivalent
# helpers via the UI / MCP. Data-only: nothing here acts until an Activity script
# routes to the network path (see README.md).

input_boolean:
  av_network_mode:
    name: AV network mode (master)
    icon: mdi:lan
  av_net_nlziet:
    name: AV network -- NLZiet
    icon: mdi:television-play
  av_net_kodi:
    name: AV network -- Kodi
    icon: mdi:kodi
  av_net_batocera:
    name: AV network -- Batocera
    icon: mdi:gamepad-variant

input_number:
  av_settle_seconds:
    name: AV settle window (seconds)
    min: 3
    max: 60
    step: 1
    initial: 12
    unit_of_measurement: s
    icon: mdi:timer-sand

template:
  - binary_sensor:
      - name: TV Bluetooth headphones
        unique_id: tv_bt_headphones
        icon: mdi:headphones
        state: >
          {{ state_attr('sensor.lg_webos_tv_oled83g67lw_audio_settings', 'soundOutput')
             in ['bt_headset', 'bt_headphone', 'bt_headphones', 'headphone'] }}
        availability: >
          {{ state_attr('sensor.lg_webos_tv_oled83g67lw_audio_settings', 'soundOutput') is not none }}

